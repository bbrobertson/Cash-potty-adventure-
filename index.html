<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b7eaf4"><title>Cash's Potty Adventure</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;background:linear-gradient(#a8e8fa,#fff4d6);color:#26465a;text-align:center;min-height:100dvh}main{max-width:640px;margin:auto;padding:14px}h1{font-size:clamp(25px,7vw,38px);margin:8px 0}.panel{background:#ffffffdf;border:4px solid #fff;border-radius:28px;padding:16px;box-shadow:0 9px 0 #80c9d47a}.stage{height:250px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(#c8f4ff 70%,#e6cfa6 70%);border-radius:22px;overflow:hidden;margin:10px 0}.dino{font-size:130px;line-height:1;filter:drop-shadow(0 8px 2px #0002);animation:bob 2s ease-in-out infinite}.prop{font-size:85px;position:absolute;right:7%;bottom:14px}.bubble{font-size:20px;font-weight:800;min-height:65px;padding:12px;background:#fff8d8;border-radius:20px;margin:10px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:19px;background:#ffb347;color:#422c23;font-size:21px;font-weight:900;padding:17px 8px;box-shadow:0 5px 0 #d98626;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 1px 0 #d98626}button.alt{background:#a9e9a4;box-shadow:0 5px 0 #6ba96a}button.blue{background:#a9d8ff;box-shadow:0 5px 0 #6da6d7}button.full{grid-column:1/-1}#progress{font-size:15px;font-weight:800;margin:8px}#stars{font-size:27px;min-height:36px}#mute{position:absolute;top:12px;right:12px;font-size:14px;padding:9px;background:white;box-shadow:none}.stage .tummy{position:absolute;bottom:24px;left:10px;font-size:20px}.small{font-size:13px;margin-top:12px;color:#546a75}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes pop{50%{transform:scale(1.15)}}.celebrate .dino{animation:pop .45s infinite}.sparkle{font-size:55px;position:absolute;top:8px;left:10px}</style></head><body><main><h1>🦕 Cash's Potty Adventure</h1><div class="panel"><div id="progress">Let's play!</div><div class="stage" id="stage"><button id="mute" onclick="toggleSound()">🔊 Sound on</button><span id="sparkle" class="sparkle"></span><div id="dino" class="dino">🦖</div><div id="prop" class="prop">🚗</div><button class="tummy" id="replay" onclick="say(message)">🔁 Hear Dino</button></div><div class="bubble" id="bubble">Hi Cash! Let's play!</div><div id="stars"></div><div class="buttons" id="buttons"></div></div><div class="small">Made for Cash • No ads • No purchases • Works best with sound on</div></main><script>
let sound=true,stage='start',kind='pee',message='',stars=0,step=0;const bubble=document.getElementById('bubble'),buttons=document.getElementById('buttons'),prop=document.getElementById('prop'),progress=document.getElementById('progress'),sparkle=document.getElementById('sparkle'),scene=document.getElementById('stage');let audioCtx;
function tone(freq=440,dur=.13,type='sine'){if(!sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(.09,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function effect(name){if(name==='plop'){tone(145,.17,'triangle');setTimeout(()=>tone(95,.24,'sine'),190)}else if(name==='flush'){for(let i=0;i<9;i++)setTimeout(()=>tone(600-i*50,.13,'sawtooth'),i*90)}else if(name==='water'){for(let i=0;i<7;i++)setTimeout(()=>tone(600+i*35,.09),i*90)}else if(name==='cheer'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22),i*180))}else tone(340,.2,'triangle')}
function say(t){message=t;bubble.textContent=t;if(!sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.88;u.pitch=1.65;u.volume=1;window.speechSynthesis.speak(u)}
function toggleSound(){sound=!sound;document.getElementById('mute').textContent=sound?'🔊 Sound on':'🔇 Sound off';if(!sound)window.speechSynthesis?.cancel();else say(message)}
function show(text,opts,emoji='🚗',label='Potty Adventure'){progress.textContent=label;prop.textContent=emoji;sparkle.textContent='';scene.classList.remove('celebrate');buttons.innerHTML='';for(let o of opts){let b=document.createElement('button');b.textContent=o[0];b.className=o[2]||'';b.onclick=()=>{tone(460,.09);o[1]()};buttons.appendChild(b)}say(text)}
function start(){stage='start';show('Hi Cash! I am Dino! Want to play with me?', [['▶️ Let’s play!',feeling,'full alt'],['🔊 Hear me!',()=>say(message),'full blue']],'🚗','Meet Dino')}
function feeling(){stage='feeling';effect('plop');show('Rumble rumble! Oh! My body says I need the potty! What do you think?', [['💦 Pee!',()=>choose('pee')],['💩 Poop!',()=>choose('poop')],['🔁 Tummy sound',()=>{effect('plop');say('Rumble rumble! My tummy is talking!')},'full blue']],'💭','1 · Notice the feeling')}
function choose(k){kind=k;show(`I need to ${kind}! Let's stop playing and go to the bathroom. My toys will wait for me!`,[['🚶 Go to bathroom',bathroom,'full alt'],['🚗 Play a little more',()=>show('Okay! We can take a moment. My toys will be right here when I am ready.',[['🚶 Ready now!',bathroom,'full alt'],['🔁 Hear Dino',()=>say(message),'full blue']],'🚗','2 · Getting ready') ,'full blue']],'🚪','2 · Stop and go')}
function bathroom(){show('Here is the bathroom! First, let’s pull down my pants!',[['👖 Pull pants down',pants,'full alt']],'🚽','3 · Bathroom time')}
function pants(){effect('pop');show('Wheee! Pants down! Now help me sit on the potty.',[['🚽 Sit on potty',sit,'full alt']],'👖','4 · Pants down')}
function sit(){show('I am sitting! I can relax and take my time. Breathe in... and out.',[['💨 Relax and try',go,'full alt'],['🙂 Not ready yet',notYet,'full blue']],'🚽','5 · Sitting on the potty')}
function notYet(){show('That is okay! I listened to my body. I can try again later.',[['🚽 Try sitting again',sit,'full alt'],['🚗 Go back to play',start,'full blue']],'🧸','Taking our time')}
function go(){effect(kind==='poop'?'plop':'water');show(kind==='poop'?'PLOP! I did a poop! My tummy feels better!':'Pssss! I did a pee! My body feels better!',[['🧻 Wipe',wipe,'full alt'],['🔁 Silly sound',()=>effect(kind==='poop'?'plop':'water'),'full blue']],'🚽','6 · Potty success')}
function wipe(){show('Time to wipe and get clean! Now pull up my pants.',[['👖 Pants up!',up,'full alt']],'🧻','7 · Wipe and get dressed')}
function up(){show('Pants are up! Let’s flush the toilet!',[['🚽 FLUSH!',flush,'full alt']],'👖','8 · Pants up')}
function flush(){effect('flush');show('Wooooosh! Bye-bye pee and poop! Now let’s wash our hands.',[['🧼 Wash hands',wash,'full alt'],['🔁 Flush again',()=>effect('flush'),'full blue']],'🚽','9 · Flush')}
function wash(){effect('water');show('Rub-a-dub! Soap and water! Scrub, scrub, scrub! All clean!',[['⭐ Celebrate!',win,'full alt'],['🔁 Water sounds',()=>effect('water'),'full blue']],'🫧','10 · Wash hands')}
function win(){stars++;document.getElementById('stars').textContent='⭐'.repeat(Math.min(stars,8));scene.classList.add('celebrate');sparkle.textContent='🎉';effect('cheer');show('Hooray! I listened to my body! Now I can go back to playing!',[['🚗 Back to play',start,'full alt'],['💦 Pee adventure',()=>choose('pee')],['💩 Poop adventure',()=>choose('poop')]],'🏆','You did it!');scene.classList.add('celebrate');sparkle.textContent='🎉'}
start();</script></body></html>
